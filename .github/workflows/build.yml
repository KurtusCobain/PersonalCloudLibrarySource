name: build

on:
  push:
    branches:
      - main
      - audit/pcls-stabilization-20261124
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Resolve package identity
        shell: pwsh
        run: |
          $manifestPath = '.\PersonalCloudLibrarySource\extension.yaml'
          $extensionVersion = Select-String -Path $manifestPath -Pattern '^Version:\s*(.+)$' |
            Select-Object -First 1 |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          if ([string]::IsNullOrWhiteSpace($extensionVersion)) {
            throw "Unable to determine extension version from $manifestPath"
          }

          "PCLS_VERSION=$extensionVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release baseline contract
        shell: pwsh
        run: .\tools\test-release-baseline.ps1

      - name: Validate unpublished stabilization candidate
        if: github.ref == 'refs/heads/audit/pcls-stabilization-20261124'
        shell: pwsh
        run: |
          Import-Module .\tools\ReleaseValidation.psm1 -Force
          Assert-UnpublishedCandidate -ExtensionPath .\PersonalCloudLibrarySource\extension.yaml -AddonPath .\playnite-addon\addon-database.yaml -InstallerPath .\playnite-addon\installer.yaml

      - name: Run standalone manifest generator regressions
        shell: powershell
        run: .\tools\test-manifest-generator.ps1

      - name: Audit tracked repository inputs
        shell: pwsh
        run: .\tools\audit-repository.ps1 -ReportPath "$env:RUNNER_TEMP\pcls-repository-audit.json"

      - name: Upload repository audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pcls-repository-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/pcls-repository-audit.json
          if-no-files-found: warn

      - name: Restore NuGet packages
        run: nuget restore .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln

      - name: Build Debug
        run: msbuild .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU"

      - name: Run full test suite
        shell: pwsh
        run: |
          & .\PersonalCloudLibrarySource.Tests\bin\Debug\PersonalCloudLibrarySource.Tests.exe --noheader '--result=TestResult.xml;format=nunit2'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Only the authorized isolated stabilization branch exercises a pinned
      # real provider binary. No credentials, real remotes, or release actions.
      - name: Qualify pinned rclone with disposable local-only fixtures
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/pcls-stabilization-20261124'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v1.76.0'
          $sha256 = '8b4fd2737ade4e70c057ef4a49deb7cffe94b0fb9d7587c189d149823f21a1dc'
          $root = Join-Path $env:RUNNER_TEMP ('pcls-rclone-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $zip = Join-Path $root 'rclone.zip'
          $url = "https://github.com/rclone/rclone/releases/download/$version/rclone-$version-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $sha256) {
            throw 'Pinned rclone archive digest mismatch.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          $env:PCLS_TEST_RCLONE_EXE = Join-Path $root "rclone-$version-windows-amd64\rclone.exe"
          $env:RCLONE_CONFIG = Join-Path $root 'isolated.conf'
          "[pcls-fixture]`ntype = local`n" | Set-Content -LiteralPath $env:RCLONE_CONFIG -Encoding ascii
          $env:PCLS_TEST_RCLONE_ISOLATED_CONFIG = '1'
          & $env:PCLS_TEST_RCLONE_EXE version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned rclone executable failed.' }
          & .\PersonalCloudLibrarySource.Tests\bin\Debug\PersonalCloudLibrarySource.Tests.exe --noheader '--test=PersonalCloudLibrarySource.Tests.Transfers.RcloneLocalBinaryIntegrationTests' '--result=RcloneLocalResult.xml;format=nunit2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'RcloneLocalResult.xml')) { throw 'Missing real-rclone test evidence.' }
          [xml]$report = Get-Content -LiteralPath 'RcloneLocalResult.xml' -Raw
          if ([int]$report.'test-results'.total -ne 2 -or [int]$report.'test-results'.failures -ne 0 -or [int]$report.'test-results'.'not-run' -ne 0) {
            throw 'Both disposable real-rclone cases must execute and pass.'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pcls-test-results-${{ github.run_number }}
          path: |
            TestResult.xml
            RcloneLocalResult.xml
          if-no-files-found: warn

      - name: Build Release package
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'package-build.log'
          try {
            & .\tools\package-extension.ps1 *>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              throw "Package script exited with code $LASTEXITCODE."
            }
          }
          catch {
            ($_ | Format-List * -Force | Out-String) | Add-Content -LiteralPath $logPath
            throw
          }

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pcls-package-diagnostics-${{ github.run_number }}
          path: package-build.log
          if-no-files-found: warn

      - name: Inspect packaged extension
        shell: pwsh
        run: |
          $package = ".\dist\PersonalCloudLibrarySource-$env:PCLS_VERSION.pext"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Package was not created: $package"
          }

          & .\tools\test-release-baseline.ps1 -PackagePath $package
          if ($env:GITHUB_REF -eq 'refs/heads/audit/pcls-stabilization-20261124') {
            Import-Module .\tools\ReleaseValidation.psm1 -Force
            Assert-UnpublishedCandidate -ExtensionPath .\PersonalCloudLibrarySource\extension.yaml -AddonPath .\playnite-addon\addon-database.yaml -InstallerPath .\playnite-addon\installer.yaml -PackagePath $package
          }

          $inspect = Join-Path $env:RUNNER_TEMP 'pcls-package-inspect'
          if (Test-Path -LiteralPath $inspect) {
            Remove-Item -LiteralPath $inspect -Recurse -Force
          }
          New-Item -ItemType Directory -Path $inspect -Force | Out-Null

          $zip = "$package.zip"
          Copy-Item -LiteralPath $package -Destination $zip -Force
          Expand-Archive -LiteralPath $zip -DestinationPath $inspect -Force

          $manifest = Get-Content -LiteralPath (Join-Path $inspect 'extension.yaml') -Raw
          if ($manifest -notmatch "(?m)^Version:\s*$([regex]::Escape($env:PCLS_VERSION))\s*$") {
            throw "Packaged extension manifest is not version $env:PCLS_VERSION."
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Image]::FromFile((Join-Path $inspect 'icon.png'))
          $wide = [System.Drawing.Image]::FromFile((Join-Path $inspect 'Assets\pcls-logo-wide.png'))
          try {
            if ($icon.Width -ne 512 -or $icon.Height -ne 512) {
              throw "icon.png has unexpected dimensions: $($icon.Width)x$($icon.Height)"
            }
            if ($wide.Width -ne 1400 -or $wide.Height -ne 420) {
              throw "pcls-logo-wide.png has unexpected dimensions: $($wide.Width)x$($wide.Height)"
            }
          }
          finally {
            $icon.Dispose()
            $wide.Dispose()
          }

          Write-Host 'Package inspection passed.'

      - name: Upload test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PersonalCloudLibrarySource-${{ env.PCLS_VERSION }}-test
          path: dist/PersonalCloudLibrarySource-${{ env.PCLS_VERSION }}.pext
          if-no-files-found: error
