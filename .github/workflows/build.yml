name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Resolve package identity
        shell: pwsh
        run: |
          $manifestPath = '.\PersonalCloudLibrarySource\extension.yaml'
          $extensionVersion = Select-String -Path $manifestPath -Pattern '^Version:\s*(.+)$' |
            Select-Object -First 1 |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          if ([string]::IsNullOrWhiteSpace($extensionVersion)) {
            throw "Unable to determine extension version from $manifestPath"
          }

          "PCLS_VERSION=$extensionVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release baseline contract
        shell: pwsh
        run: .\tools\test-release-baseline.ps1

      - name: Restore NuGet packages
        run: nuget restore .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln

      - name: Build Debug
        run: msbuild .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU"

      - name: Run full test suite
        shell: pwsh
        run: |
          & .\PersonalCloudLibrarySource.Tests\bin\Debug\PersonalCloudLibrarySource.Tests.exe --noheader '--result=TestResult.xml;format=nunit2'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcls-test-results-${{ github.run_number }}
          path: TestResult.xml
          if-no-files-found: warn

      - name: Build Release package
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'package-build.log'
          try {
            & .\tools\package-extension.ps1 *>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              throw "Package script exited with code $LASTEXITCODE."
            }
          }
          catch {
            ($_ | Format-List * -Force | Out-String) | Add-Content -LiteralPath $logPath
            throw
          }

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcls-package-diagnostics-${{ github.run_number }}
          path: package-build.log
          if-no-files-found: warn

      - name: Inspect packaged extension
        shell: pwsh
        run: |
          $package = ".\dist\PersonalCloudLibrarySource-$env:PCLS_VERSION.pext"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Package was not created: $package"
          }

          & .\tools\test-release-baseline.ps1 -PackagePath $package

          $inspect = Join-Path $env:RUNNER_TEMP 'pcls-package-inspect'
          if (Test-Path -LiteralPath $inspect) {
            Remove-Item -LiteralPath $inspect -Recurse -Force
          }
          New-Item -ItemType Directory -Path $inspect -Force | Out-Null

          $zip = "$package.zip"
          Copy-Item -LiteralPath $package -Destination $zip -Force
          Expand-Archive -LiteralPath $zip -DestinationPath $inspect -Force

          $manifest = Get-Content -LiteralPath (Join-Path $inspect 'extension.yaml') -Raw
          if ($manifest -notmatch "(?m)^Version:\s*$([regex]::Escape($env:PCLS_VERSION))\s*$") {
            throw "Packaged extension manifest is not version $env:PCLS_VERSION."
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Image]::FromFile((Join-Path $inspect 'icon.png'))
          $wide = [System.Drawing.Image]::FromFile((Join-Path $inspect 'Assets\pcls-logo-wide.png'))
          try {
            if ($icon.Width -ne 512 -or $icon.Height -ne 512) {
              throw "icon.png has unexpected dimensions: $($icon.Width)x$($icon.Height)"
            }
            if ($wide.Width -ne 1400 -or $wide.Height -ne 420) {
              throw "pcls-logo-wide.png has unexpected dimensions: $($wide.Width)x$($wide.Height)"
            }
          }
          finally {
            $icon.Dispose()
            $wide.Dispose()
          }

          Write-Host 'Package inspection passed.'

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: PersonalCloudLibrarySource-${{ env.PCLS_VERSION }}-test
          path: dist/PersonalCloudLibrarySource-${{ env.PCLS_VERSION }}.pext
          if-no-files-found: error
