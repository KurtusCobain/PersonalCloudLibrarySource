name: apply-setup-wizard-integration

on:
  push:
    branches:
      - feature/user-friendly-dashboard
    paths:
      - automation/apply-setup-wizard-integration.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-dashboard

      - name: Apply focused setup wizard integration
        run: python tools/apply-setup-wizard-integration.py

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalCloudLibrarySource/PersonalCloudLibrarySource.Navigation.cs PersonalCloudLibrarySource/Dashboard/CloudLibraryDashboardView.xaml
          if git diff --cached --quiet; then
            echo "No integration changes were needed."
            exit 0
          fi
          git commit -m "Integrate setup wizard with dashboard navigation [skip ci]"
          git push origin HEAD:feature/user-friendly-dashboard
