name: audit-feature-branch

on:
  push:
    branches:
      - feature/user-friendly-dashboard
    paths:
      - automation/audit-feature-branch.txt

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-dashboard

      - name: Apply consolidated repair
        shell: pwsh
        run: python tools/audit-feature-branch.py

      - uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        id: restore
        continue-on-error: true
        shell: pwsh
        run: |
          nuget restore .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln *>&1 | Tee-Object -FilePath restore.log
          exit $LASTEXITCODE

      - name: Build Debug
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU" *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Run NUnitLite tests
        id: tests
        if: steps.restore.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          .\PersonalCloudLibrarySource.Tests\bin\Debug\PersonalCloudLibrarySource.Tests.exe --noheader *>&1 | Tee-Object -FilePath tests.log
          exit $LASTEXITCODE

      - name: Record audit and consolidate branch
        if: always()
        shell: pwsh
        run: |
          $restore = "${{ steps.restore.outcome }}"
          $build = "${{ steps.build.outcome }}"
          $tests = "${{ steps.tests.outcome }}"
          $passed = $restore -eq "success" -and $build -eq "success" -and $tests -eq "success"
          $result = if ($passed) { "PASS" } else { "FAIL" }
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $lines = @(
            "# User-Friendly Dashboard Branch Audit",
            "",
            "- Result: **$result**",
            "- Verified at: $timestamp",
            "- Branch: feature/user-friendly-dashboard",
            "- Source commit: ${{ github.sha }}",
            "- NuGet restore: $restore",
            "- Debug build: $build",
            "- NUnitLite tests: $tests",
            "",
            "## Repairs included",
            "",
            "- Restored dashboard constructor consistency.",
            "- Added queued rclone execution to CloudTransferExecutor.",
            "- Registered orphaned activity and rclone tests in the projects.",
            "- Removed temporary patch workflows, marker files, scripts, and stale verification logs after a passing run.",
            ""
          )
          foreach ($name in @("restore", "build", "tests")) {
            $path = "$name.log"
            if (Test-Path $path) {
              $lines += "## $name log tail"
              $lines += ""
              $lines += Get-Content $path | Select-Object -Last 120
              $lines += ""
            }
          }
          New-Item -ItemType Directory -Path docs\superpowers\verification -Force | Out-Null
          $lines | Set-Content docs\superpowers\verification\branch-audit-status.md -Encoding UTF8

          if ($passed) {
            git rm -f --ignore-unmatch `
              .github/workflows/audit-feature-branch.yml `
              .github/workflows/cleanup-rclone-verification.yml `
              .github/workflows/verify-actionable-transfer-ui.yml `
              .github/workflows/verify-rclone-queue-integration.yml `
              .github/workflows/verify-rclone-transfer-adapter.yml `
              .github/workflows/verify-settings-tabs.yml `
              automation/audit-feature-branch.txt `
              automation/cleanup-rclone-verification.txt `
              automation/verify-actionable-transfer-ui.txt `
              automation/verify-rclone-queue-integration.txt `
              automation/verify-rclone-transfer-adapter.txt `
              automation/verify-settings-tabs.txt `
              tools/audit-feature-branch.py `
              tools/apply-actionable-transfer-ui.py `
              tools/apply-rclone-queue-integration.py `
              tools/register-rclone-transfer-adapter.py `
              docs/superpowers/verification/audit-in-progress.md `
              docs/superpowers/verification/actionable-transfer-ui-status.md `
              docs/superpowers/verification/game-context-actions-status.md `
              docs/superpowers/verification/local-install-integration-status.md `
              docs/superpowers/verification/local-transfer-executor-status.md `
              docs/superpowers/verification/rclone-queue-integration-status.md `
              docs/superpowers/verification/rclone-transfer-adapter-status.md `
              docs/superpowers/verification/transfer-foundation-status.md `
              docs/superpowers/verification/user-friendly-dashboard-status.md `
              docs/superpowers/verification/settings-tabs-status.md
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $message = if ($passed) { "Repair and consolidate user-friendly dashboard branch [skip ci]" } else { "Apply branch audit repairs and record failing verification [skip ci]" }
          git commit -m $message
          git push origin HEAD:feature/user-friendly-dashboard

      - name: Fail when audit verification failed
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.restore.outcome }}" -ne "success" -or "${{ steps.build.outcome }}" -ne "success" -or "${{ steps.tests.outcome }}" -ne "success") {
            exit 1
          }
