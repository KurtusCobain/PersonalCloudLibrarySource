name: apply-dashboard-navigation

on:
  push:
    branches:
      - feature/user-friendly-dashboard
    paths:
      - automation/apply-dashboard-navigation.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-dashboard

      - name: Apply focused source patch
        run: python tools/apply-dashboard-navigation-patch.py

      - name: Commit patched plugin source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalCloudLibrarySource/PersonalCloudLibrarySource.cs
          if git diff --cached --quiet; then
            echo "No patch changes were needed."
            exit 0
          fi
          git commit -m "Wire dashboard navigation into library plugin [skip ci]"
          git push origin HEAD:feature/user-friendly-dashboard
