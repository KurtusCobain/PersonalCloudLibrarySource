name: CodeQL C# security (v1 integration)

on:
  push:
    branches:
      - feature/v1-combined-integration-20261103
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze-csharp:
    name: CodeQL C# — Windows .NET Framework build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build source for CodeQL
        shell: pwsh
        run: |
          msbuild .\PersonalCloudLibrarySource\PersonalCloudLibrarySource.sln /t:Rebuild /p:Configuration=Debug /p:Platform="Any CPU"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze C# source and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp/v1-integration"
