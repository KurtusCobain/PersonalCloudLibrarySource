AddonId: 'PersonalCloudLibrarySource_61993828-67a8-4468-93a2-293442e36328'
Packages:
  - Version: '0.2.0'
    RequiredApiVersion: '6.16.0'
    ReleaseDate: '2026-06-15'
    PackageUrl: https://github.com/KurtusCobain/PersonalCloudLibrarySource/releases/download/v0.2.0/PersonalCloudLibrarySource-0.2.0.pext
    Changelog:
      - Added guided setup support for local manifest generation inside Playnite settings.
      - Added universal manifest generation for local folders, external drives, mapped drives, NAS paths, and rclone remotes.
      - Added sourceType-aware manifest items for file and directory package workflows.
      - Added directory-package detection for disc folders, PC folders, and Wii U code/content/meta layouts.
      - Added verification report output for manifest generation and setup troubleshooting.
      - Added safer plugin-side file writes for generated manifests and reports.
      - Improved the settings status card contrast for Playnite dark theme readability.
      - Kept compatibility with older manifests that omit sourceType.
