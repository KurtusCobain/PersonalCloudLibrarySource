# Published packages: retain v0.2.0 for existing users and rollback availability.
Packages:
  - Version: '0.3.2'
    RequiredApiVersion: '6.16.0'
    ReleaseDate: '2026-11-01'
    PackageUrl: https://github.com/KurtusCobain/PersonalCloudLibrarySource/releases/download/v0.3.2/PersonalCloudLibrarySource-0.3.2.pext
    Changelog:
      - Added bounded, cancellable setup preview and background local/NAS catalog generation.
      - Improved on-demand local and rclone transfers, queue progress, cancellation and retry.
      - Restricted new installs to the configured cache and improved filesystem and ownership safety.
      - Fixed Windows receipt staging paths and rclone cancellation temporary-file cleanup.
      - Improved source-health diagnostics, dashboard state and dark-theme Details readability.
      - Preserved v0.2.0 settings and game identities during upgrade; migrated the default rclone timeout to 90 seconds.
      - Recursive directory cache uninstall remains disabled pending further qualification.
  - Version: '0.2.0'
    RequiredApiVersion: '6.16.0'
    ReleaseDate: '2026-06-15'
    PackageUrl: https://github.com/KurtusCobain/PersonalCloudLibrarySource/releases/download/v0.2.0/PersonalCloudLibrarySource-0.2.0.pext
    Changelog:
      - Added guided setup support for local manifest generation inside Playnite settings.
      - Added universal manifest generation for local folders, external drives, mapped drives, NAS paths, and rclone remotes.
      - Added sourceType-aware manifest items for file and directory package workflows.
      - Added directory-package detection for disc folders, PC folders, and Wii U code/content/meta layouts.
      - Added verification report output for manifest generation and setup troubleshooting.
      - Added safer plugin-side file writes for generated manifests and reports.
      - Improved the settings status card contrast for Playnite dark theme readability.
      - Kept compatibility with older manifests that omit sourceType.
