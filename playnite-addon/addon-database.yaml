Name: 'Personal Cloud Library Source'
Author: 'The Bearclaw & ztwslayer'
ShortDescription: 'Import your own cloud, NAS, external drive, or local manifest library into Playnite.'
InstallerManifestUrl: https://raw.githubusercontent.com/KurtusCobain/PersonalCloudLibrarySource/main/playnite-addon/installer.yaml
SourceUrl: https://github.com/KurtusCobain/PersonalCloudLibrarySource
IconUrl: https://raw.githubusercontent.com/KurtusCobain/PersonalCloudLibrarySource/main/PersonalCloudLibrarySource/icon.png

Description: |
  Personal Cloud Library Source imports a user-supplied personal library catalog into Playnite. Entries can appear before they are downloaded, be enriched with Playnite metadata, copied or downloaded to a local cache when needed, launched locally, and later uninstalled from the cache while keeping the catalog entry.

  Supports LocalFile, LocalFolder, and RcloneRemote providers. Local folders can point at fixed disks, external drives, mapped drives, synced cloud folders, or UNC/NAS paths. Google Drive, OneDrive, Dropbox, and similar services can be accessed through a user-configured rclone remote.

  Desktop provides guided setup, verification, reports, diagnostics, manifest generation, and a transfer dashboard. Imported games use standard Playnite metadata and play/install/uninstall controllers; there is no dedicated Fullscreen setup wizard or dashboard.

  Selected files or directories can be queued into a guarded local cache. Cache uninstall refuses unsafe targets and does not delete source or remote content. PCLS does not stream gameplay or automatically download a whole library.

  This does not provide games, ROMs, BIOS files, cracks, keys, copyrighted content, scraping, storefront access, credentials, or download sources. Users are responsible for content and provider access they have rights to use.
