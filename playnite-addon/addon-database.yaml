SourceUrl: https://github.com/KurtusCobain/PersonalCloudLibrarySource
IconUrl: https://raw.githubusercontent.com/KurtusCobain/PersonalCloudLibrarySource/main/PersonalCloudLibrarySource/icon.png
Description: |
  Personal Cloud Library Source imports a user-supplied personal library catalog into Playnite. Entries can appear before they are downloaded, be enriched with Playnite metadata, copied or downloaded to a local cache when needed, launched locally, and later uninstalled from the cache while keeping the catalog entry.

  Manifest generation update completed 6/2/2026

  Version 0.2.0 adds guided setup support for local manifest generation inside Playnite, verification report output for setup troubleshooting, and improved dark-theme readability in the settings status card.

  Supports LocalFile, LocalFolder, and RcloneRemote providers. Local folders, external drives, mapped drives, synced cloud folders, and NAS paths are supported directly. Google Drive, OneDrive, Dropbox, and similar cloud services are supported through rclone when users choose the RcloneRemote provider.

  This does not provide games, ROMs, BIOS files, cracks, keys, copyrighted content, scraping, storefront access, or download sources.
Tags: ['library', 'cloud', 'rclone', 'local', 'nas', 'manifest', 'external drive', 'metadata']
